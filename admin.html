<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - StayMatch</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #111111;
      color: #FFFFFF;
    }

    /* Cover Banner */
    .cover-banner {
      height: 40vh;
      background: url('admin-cover.jpg') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .cover-banner h1 {
      color: #D4AF37;
      font-size: 2.5em;
      font-weight: bold;
      background-color: rgba(0,0,0,0.6);
      padding: 15px 25px;
      border-radius: 8px;
    }

    /* Login Screen */
    #login-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    #login-screen input {
      padding: 10px;
      margin: 10px;
      width: 250px;
      border: none;
      border-radius: 5px;
    }
    #login-screen button {
      background-color: #D4AF37;
      color: #111111;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Dashboard Layout */
    #dashboard {
      display: none;
    }
    header {
      background-color: #000000;
      color: #D4AF37;
      text-align: center;
      padding: 20px;
      font-size: 1.5em;
      font-weight: bold;
    }
    .sidebar {
      width: 220px;
      background-color: #1c1c1c;
      height: 100vh;
      position: fixed;
      top: 0; left: 0;
      padding-top: 80px;
    }
    .sidebar a {
      display: block;
      color: #FFFFFF;
      padding: 12px 20px;
      text-decoration: none;
    }
    .sidebar a:hover {
      background-color: #D4AF37;
      color: #111111;
    }
    .content {
      margin-left: 240px;
      padding: 30px;
    }

    /* Receipt Generator */
    .receipt-generator {
      background-color: #1c1c1c;
      padding: 20px;
      border-radius: 8px;
      max-width: 600px;
      margin: auto;
    }
    .receipt-generator h2 {
      color: #D4AF37;
      text-align: center;
    }
    .receipt-generator label {
      display: block;
      margin: 10px 0 5px;
    }
    .receipt-generator input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: none;
      border-radius: 5px;
    }
    .receipt-generator button {
      background-color: #D4AF37;
      color: #111111;
      border: none;
      padding: 12px;
      width: 100%;
      font-size: 1.1em;
      cursor: pointer;
      border-radius: 5px;
    }

    /* Footer */
    footer {
      background-color: #000000;
      color: #D4AF37;
      text-align: center;
      padding: 15px;
      font-size: 0.9em;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <!-- Cover Banner -->
  <div class="cover-banner">
    <h1>STAYMATCH ADMIN DASHBOARD</h1>
  </div>

  <!-- Login Screen -->
  <div id="login-screen">
    <h2 style="color:#D4AF37;">ADMIN LOGIN</h2>
    <input type="text" id="username" placeholder="ENTER ADMIN USERNAME">
    <input type="password" id="password" placeholder="ENTER PASSWORD">
    <button onclick="login()">LOGIN</button>
    <p style="color:#888;">AUTHORIZED ADMINS: DUNCAN OTERI & MELISSA MWANGI</p>
  </div>

  <!-- Dashboard -->
  <div id="dashboard">
    <header>STAYMATCH ADMIN DASHBOARD</header>

    <div class="sidebar">
      <a href="#">Dashboard</a>
      <a href="#">Inquiries</a>
      <a href="#">Analytics</a>
      <a href="#">Team</a>
      <a href="#">Settings</a>
      <a href="#">Receipt Generator</a>
    </div>

    <div class="content">
      <div class="receipt-generator">
        <h2>RECEIPT GENERATOR</h2>
        <form id="receiptForm">
          <label for="clientName">CLIENT NAME</label>
          <input type="text" id="clientName" required>

          <label for="amount">AMOUNT (KES)</label>
          <input type="number" id="amount" required>

          <label for="transactionCode">TRANSACTION CODE</label>
          <input type="text" id="transactionCode" required>

          <label for="date">DATE</label>
          <input type="date" id="date" required>

          <button type="button" onclick="generateReceipt()">GENERATE RECEIPT</button>
        </form>

        <div id="receiptOutput" style="margin-top:20px; background-color:#000; padding:15px; border-radius:8px; display:none;">
          <h3 style="color:#D4AF37;">STAYMATCH RECEIPT</h3>
          <p id="receiptText"></p>
        </div>
      </div>
    </div>

    <footer>
      © 2026 Deluxe Marcapolo Stays. All Rights Reserved.
    </footer>
  </div>

  <script>
    // Secure Login
    function login() {
      const user = document.getElementById('username').value.toLowerCase();
      const pass = document.getElementById('password').value;
      if ((user === 'duncan oteri' && pass === 'admin123') || (user === 'melissa mwangi' && pass === 'admin123')) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
      } else {
        alert('ACCESS DENIED! ONLY AUTHORIZED ADMINS CAN ENTER.');
      }
    }

    // Receipt Generator
    function generateReceipt() {
      const name = document.getElementById('clientName').value;
      const amount = document.getElementById('amount').value;
      const code = document.getElementById('transactionCode').value;
      const date = document.getElementById('date').value;

      const receipt = `
        CLIENT NAME: ${name}<br>
        AMOUNT: KES ${amount}<br>
        TRANSACTION CODE: ${code}<br>
        DATE: ${date}<br>
        VERIFIED BY: STAYMATCH ADMIN TEAM
      `;
      document.getElementById('receiptText').innerHTML = receipt;
      document.getElementById('receiptOutput').style.display = 'block';
    }
  </script>

</body>
</html>
